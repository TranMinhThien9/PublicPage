<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Đăng nhập</title>
<script>try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style id="lg-css">
:root { color-scheme: light dark; --bg: #faf9f7; --fg: #1f1d1a; --muted: #6b665f; --line: #e4e0d9; --accent: #8a6a1f; --on-accent: #ffffff; --bad: #b0443a; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark; --bg: #181714; --fg: #ece9e3; --muted: #a39d93; --line: #322f2a; --accent: #d1ad5a; --on-accent: #181714; --bad: #e5776b; }
}
:root[data-theme="dark"] { color-scheme: dark; --bg: #181714; --fg: #ece9e3; --muted: #a39d93; --line: #322f2a; --accent: #d1ad5a; --on-accent: #181714; --bad: #e5776b; }
:root[data-theme="light"] { color-scheme: light; }
* { box-sizing: border-box; }
body.lg { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.lg-box { width: 100%; max-width: 320px; }
.lg-box h1 { font-size: 20px; font-weight: 600; margin: 0 0 24px; }
.lg-box label.lg-field { display: block; margin-bottom: 4px; font-size: 12px; color: var(--muted); }
.lg-box input[type=text], .lg-box input[type=password] { width: 100%; height: 36px; padding: 0 8px; font: inherit; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
.lg-box input[type=text] { margin-bottom: 12px; }
.lg-box label.lg-check { display: flex; align-items: center; gap: 8px; margin: 16px 0; color: var(--muted); font-size: 14px; }
.lg-box button { width: 100%; height: 36px; font: inherit; font-weight: 600; border: 0; border-radius: 6px; background: var(--accent); color: var(--on-accent); cursor: pointer; }
.lg-box button:disabled { opacity: .6; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#lg-msg { min-height: 1.5em; margin: 12px 0 0; color: var(--bad); font-size: 14px; }
</style>
</head>
<body class="lg">
<div class="lg-box" id="lg-box">
  <h1>Đăng nhập</h1>
  <form id="lg-form" hidden>
    <label class="lg-field" for="lg-user">Tài khoản email</label>
    <input type="text" id="lg-user" autocomplete="username" maxlength="128" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <label class="lg-field" for="lg-pass">Mật khẩu</label>
    <input type="password" id="lg-pass" autocomplete="current-password" maxlength="128" required>
    <label class="lg-check"><input type="checkbox" id="lg-remember"> Nhớ trên thiết bị này</label>
    <button type="submit" id="lg-btn">Mở</button>
  </form>
  <p id="lg-msg" role="alert"></p>
</div>
<script type="module">
const SALT = "site-salt-v1";
const ITER = 600000;
const KEY_NAME = 'k';
const MINE_NAME = 'mg';
const MAX_LEN = 128;
const $ = (id) => document.getElementById(id);
const utf8 = new TextEncoder();
const b64 = (u8) => btoa(Array.from(u8, (c) => String.fromCharCode(c)).join(''));
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

function savedKey() {
  for (const kind of ['localStorage', 'sessionStorage']) {
    try { const v = window[kind].getItem(KEY_NAME); if (v) return v; } catch { /* bo qua */ }
  }
  return null;
}
function clearKey() {
  for (const kind of ['localStorage', 'sessionStorage']) {
    try { window[kind].removeItem(KEY_NAME); window[kind].removeItem(MINE_NAME); } catch { /* bo qua */ }
  }
}
function saveKey(raw, remember) {
  clearKey();
  try { window[remember ? 'localStorage' : 'sessionStorage'].setItem(KEY_NAME, raw); } catch { /* bo qua */ }
}

async function deriveRaw(password) {
  const base = await crypto.subtle.importKey('raw', utf8.encode(password), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: utf8.encode(SALT), iterations: ITER }, base, 256));
}
const toKey = (raw) => crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']);
async function decrypt(key, buf) {
  const d = new Uint8Array(buf);
  return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: d.slice(0, 12) }, key, d.slice(12)));
}

async function encrypt(key, u8) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, u8));
  const out = new Uint8Array(12 + ct.length);
  out.set(iv);
  out.set(ct, 12);
  return out;
}
// Noi dang giu khoa (localStorage neu "Nho", khong thi sessionStorage); du lieu My Gold (mg) luu cung noi
function keyStorage() {
  for (const kind of ['localStorage', 'sessionStorage']) {
    try { if (window[kind].getItem(KEY_NAME)) return window[kind]; } catch { /* bo qua */ }
  }
  return null;
}

// Tai site.enc roi giai ma. Loi mang -> NetError; sai khoa -> loi giai ma.
class NetError extends Error {}
async function fetchBuf(url) {
  let r;
  try { r = await fetch(url, { cache: 'no-store' }); } catch { throw new NetError('net'); }
  if (!r.ok) throw new NetError('http ' + r.status);
  return r.arrayBuffer();
}
async function openSite(key) {
  const buf = await fetchBuf('site.enc');
  const site = JSON.parse(new TextDecoder().decode(await decrypt(key, buf)));
  window.goldFetchJson = async (url) => JSON.parse(new TextDecoder().decode(await decrypt(key, await fetchBuf(url + '.enc'))));
  return site;
}

async function show(site, key) {
  $('lg-css').remove();
  document.body.className = '';
  document.title = site.title;
  document.body.innerHTML = site.body;
  const st = document.createElement('style');
  st.textContent = site.css;
  document.head.appendChild(st);
  // app React ve nut "Khoa lai" khi thay window.goldOnLock
  window.goldOnLock = () => { clearKey(); location.reload(); };
  // du lieu My Gold nap tu file: ma hoa bang khoa dang nhap, khoa khong lo ra window
  window.goldSaveMine = async (text) => {
    try {
      keyStorage().setItem(MINE_NAME, b64(await encrypt(key, utf8.encode(text))));
      return true;
    } catch { return false; }
  };
  window.goldLoadMine = async () => {
    try { return new TextDecoder().decode(await decrypt(key, unb64(keyStorage().getItem(MINE_NAME)))); } catch { return null; }
  };
  const app = document.createElement('script');
  app.textContent = site.js;
  document.body.appendChild(app);
}

const form = $('lg-form'), msg = $('lg-msg'), btn = $('lg-btn');
form.hidden = true;

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  btn.disabled = true;
  btn.textContent = 'Đang tải…';
  msg.textContent = '';
  try {
    const user = $('lg-user').value.trim(), pass = $('lg-pass').value;
    if (!user || !pass || user.length > MAX_LEN || pass.length > MAX_LEN) throw new Error('bad input');
    const raw = await deriveRaw(user + '\n' + pass);
    const key = await toKey(raw);
    const site = await openSite(key);
    saveKey(b64(raw), $('lg-remember').checked);
    await show(site, key);
  } catch (err) {
    msg.textContent = err instanceof NetError ? 'Không tải được dữ liệu, thử lại sau.' : 'Sai tài khoản hoặc mật khẩu';
    btn.disabled = false;
    btn.textContent = 'Mở';
  }
});

(async () => {
  const saved = savedKey();
  if (saved) {
    msg.style.color = 'var(--muted)';
    msg.textContent = 'Đang tải…';
    try {
      const key = await toKey(unb64(saved));
      await show(await openSite(key), key);
      return;
    } catch (err) {
      if (err instanceof NetError) { msg.style.color = ''; msg.textContent = 'Không tải được dữ liệu, thử lại sau.'; }
      else { clearKey(); msg.style.color = ''; msg.textContent = ''; }
    }
  }
  form.hidden = false;
})();
</script>
</body>
</html>
